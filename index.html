<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Mobile Tint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- PARCHE DE SEGURIDAD: Engañamos a la librería de Google para que crea que está en un servidor -->
    <!-- Esto evita que la página se quede en blanco -->
    <script>
        window.process = {
            env: {
                NODE_ENV: 'production',
                GOOGLE_CLOUD_PROJECT: 'elite-tint-project',
                GOOGLE_CLOUD_LOCATION: 'us-central1',
                PROXY_HEADER: 'x-proxy-header'
            }
        };
    </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
